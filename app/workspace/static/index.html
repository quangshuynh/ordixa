<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="ordixa-token" content="{{TOKEN}}">
  <meta name="ordixa-version" content="{{VERSION}}">
  <title>Ordixa Workspace</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="bar">
    <a class="brand" href="#/" aria-label="Ordixa workspace home">
      <span class="wordmark">Ordixa</span>
      <span class="brand-sub">Workspace</span>
    </a>
    <p class="privacy" id="privacy">
      <svg aria-hidden="true" viewBox="0 0 16 16" width="14" height="14"><path d="M4 7V5a4 4 0 1 1 8 0v2h1v8H3V7h1Zm2 0h4V5a2 2 0 1 0-4 0v2Z" fill="currentColor"/></svg>
      Works only on this computer. Nothing is uploaded anywhere.
    </p>
  </header>
  <main id="main" tabindex="-1">
    <noscript><p class="panel">The Ordixa workspace needs JavaScript turned on in this browser.</p></noscript>
  </main>
  <div class="live" id="live" role="status" aria-live="polite"></div>
</body>
</html>
